name: Observatory

on:
  workflow_run:
    workflows: ["Fly Deploy"]
    types: [completed]

jobs:
  grade:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run observatory
